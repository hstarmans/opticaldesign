[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prisms"
version = "0.2.0"
description = "Optical design and simulation of laser prism scanner known as Hexastorm"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "Rik Starmans", email = "hstarmans@hexastorm.com" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    "sympy>=1.13.0",
    "matplotlib>=3.8.0",
    "imageio>=2.35.0",
    "pyyaml>=6.0.0",
    "pyoptools",
    "plotly>=7.0.0",
]

[project.urls]
Homepage = "https://www.hexastorm.com"
Documentation = "https://hackaday.io/project/21933-open-hardware-fast-high-resolution-laser"
Repository = "https://github.com/hstarmans/opticaldesign"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]
notebook = [
    "marimo>=0.8.0",
    "ipykernel>=6.29.0",
]

[tool.uv.sources]
pyoptools = { path = "/home/hexastorm/Documents/Python/pyoptools", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/prisms"]

[tool.hatch.metadata]
allow-direct-references = true
